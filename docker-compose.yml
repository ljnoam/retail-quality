services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: retail_quality
      POSTGRES_USER: retail_quality
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_quality -d retail_quality"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
